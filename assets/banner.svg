  <text x="61" y="192" class="nr" font-size="66.0" letter-spacing="-1.2" fill="#e7ecfa">Gonzalo Bernal López</text>
  <text x="64" y="238" class="m4" font-size="14.5" letter-spacing="2.6" fill="#93a0bd">DESARROLLADOR FULL-STACK · MURCIA</text>
