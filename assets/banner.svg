<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t">
  <title id="t">Gonzalo Bernal López · Desarrollador full-stack en Murcia. En producción: cardifly.es, elopeak.lol y grx.coach</title>
  <defs>
    <style>
      @font-face { font-family: 'NR'; font-weight: 500; src: url(data:font/woff;base64,) format('woff'); }
      @font-face { font-family: 'PM'; font-weight: 400; src: url(data:font/woff;base64,) format('woff'); }
      @font-face { font-family: 'PM'; font-weight: 500; src: url(data:font/woff;base64,) format('woff'); }
      .nr { font-family: 'NR', Georgia, serif; font-weight: 500; }
      .m4 { font-family: 'PM', ui-monospace, Consolas, monospace; font-weight: 400; }
      .m5 { font-family: 'PM', ui-monospace, Consolas, monospace; font-weight: 500; }
      .ping { transform-box: fill-box; transform-origin: center; opacity: 0;
               animation: ping 2.4s cubic-bezier(0, 0, .2, 1) infinite; }
      .p2 { animation-delay: .8s; }
      .p3 { animation-delay: 1.6s; }
      @keyframes ping { 0% { transform: scale(1); opacity: .85; } 75%, 100% { transform: scale(2.9); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .ping { animation: none; } }
    </style>
    <clipPath id="card"><rect width="1200" height="380" rx="20"/></clipPath>
    <radialGradient id="glow" cx="170" cy="40" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5d8bff" stop-opacity=".20"/>
      <stop offset="1" stop-color="#5d8bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.1" fill="#1b2440"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset=".25" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="dotmask"><rect width="1200" height="380" fill="url(#fade)"/></mask>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="#060a16"/>
    <rect width="1200" height="380" fill="url(#glow)"/>
    <rect width="1200" height="380" fill="url(#dots)" mask="url(#dotmask)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="379" rx="19.5" fill="none" stroke="#1b2440"/>

