    <circle cx="804" cy="161.5" r="5" fill="#45dfa0"/>
    <circle class="ping p1" cx="804" cy="161.5" r="5" fill="none" stroke="#45dfa0" stroke-width="1.6"/>
    <text x="826" y="168" class="m4" font-size="19" fill="#e7ecfa">cardifly.es</text>
    <text x="1110" y="168" class="m5" font-size="12" letter-spacing="1.2" fill="#45dfa0" text-anchor="end">200 OK</text>
    <line x1="800" y1="193" x2="1112" y2="193" stroke="#1b2440" stroke-width="1"/>
    <circle cx="804" cy="219.5" r="5" fill="#45dfa0"/>
